name: Deploy

# push 契約は外した: デプロイ先 (MINIPC) はクラウド runner から届かず、main へ毎回 failure が残るため。
# self-hosted runner を用意できたら push トリガーを戻す。手動実行は ref を選んで走らせる。
on:
  workflow_dispatch:

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/_shared-deploy.yml
    with:
      environment: staging
      branch: develop
      deploy-command: 'docker-compose restart'
    secrets:
      SSH_KEY: ${{ secrets.MINIPC_SSH_KEY }}
      SSH_HOST: ${{ secrets.MINIPC_HOST }}
      SSH_USER: ${{ secrets.MINIPC_USER }}
  
  deploy-production:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    uses: ./.github/workflows/_shared-deploy.yml
    with:
      environment: production
      branch: main
      deploy-command: 'docker-compose restart'
    secrets:
      SSH_KEY: ${{ secrets.MINIPC_SSH_KEY }}
      SSH_HOST: ${{ secrets.MINIPC_HOST }}
      SSH_USER: ${{ secrets.MINIPC_USER }}
