name: PR Check

on:
  pull_request:
    branches: [main, develop, master]

jobs:
  check:
    # コピー配布をやめ qa-workflows の reusable に集約（dev-platform#1855）。
    # lint / build / test は script があれば実行し、失敗はそのまま赤にする。
    uses: flipslidersand-labs/qa-workflows/.github/workflows/node-test.yml@main
    with:
      node-version: "22"
      package-manager: pnpm
      # runner は渡さない: api-server は public で linux-general(private 限定グループ)に載らない。
      # quality.yml と同じく reusable 側の解決（vars.GATE_RUNNER → ubuntu-latest）に任せる
